asyncapi: 3.0.0
info:
  title: Device Commands Controller
  version: 1.0.0
  description: Kafka API for sending commands to devices
servers:
  production:
    host: kafka.warmhouse.com:9092
    protocol: kafka
    description: Production Kafka server

defaultContentType: application/json

channels:
  deviceCommands:
    description: Channel for sending commands to devices
    address: device-commands
    messages:
      deviceCommand:
        $ref: "#/components/messages/DeviceCommand"

operations:
  sendDeviceCommand:
    description: Send a command to a device
    action: send
    channel:
      $ref: "#/channels/deviceCommands"

components:
  messages:
    DeviceCommand:
      payload:
        type: object
        properties:
          deviceId:
            type: string
            description: The ID of the device to send the command to
          command:
            type: string
            description: The command to send to the device
          value:
            type: string
            description: Optional command value
        required:
          - deviceId
          - command
